<div class="card">
 <div class="head">
   <div class="search">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 30 30" width="30px" height="30px"><circle style="fill:none;stroke:#000000;stroke-width:2;stroke-miterlimit:10;" cx="13" cy="13" r="9"/><line style="fill:none;stroke:#000000;stroke-width:2;stroke-linecap:round;stroke-miterlimit:10;" x1="26" y1="26" x2="19.437" y2="19.437"/></svg>
    <input class="input" placeholder="Chercher" (input)="applyFilter($event)">
   </div> 
   <div class="btns">
    <button (click)="exportToPDF()" style="margin: 10px;">
      <svg width="22" height="23" viewBox="0 0 22 23" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></button>
    <button  class="add" (click)="addTuktuk()">Ajouter</button>
  </div>
 </div>
<div>
 <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    
  <!-- <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>      
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container> -->
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef> Nom </th>      
      <td mat-cell *matCellDef="let element"> {{element.nom}} </td>
    </ng-container>
  
    <ng-container matColumnDef="telephone">
      <th mat-header-cell *matHeaderCellDef> Téléphone </th>      
    <td mat-cell *matCellDef="let element"> {{element.telephone}} </td>
    </ng-container>
  
    <ng-container matColumnDef="matricule">
      <th mat-header-cell *matHeaderCellDef> Matricule </th>      
    <td mat-cell *matCellDef="let element"> {{element.matricule}} </td>
    </ng-container>

    <ng-container matColumnDef="nserie">
        <th mat-header-cell *matHeaderCellDef>N.Serie</th>      
      <td mat-cell *matCellDef="let element"> {{element.nserie}} </td>
      </ng-container>

      <ng-container matColumnDef="wilaya">
        <th mat-header-cell *matHeaderCellDef>Wilaya</th>      
      <td mat-cell *matCellDef="let element"> {{element.wilaya}} </td>
      </ng-container>

      <ng-container matColumnDef="logo">
        <th mat-header-cell *matHeaderCellDef>Logo</th>      
      <td mat-cell *matCellDef="let element">
         <mat-checkbox [(ngModel)]="element.logo" disabled></mat-checkbox> 
         </td>
      </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions</th>      
    <td mat-cell *matCellDef="let tuktuk; let i = index"> 
      <button (click)="deleteTuktuk(tuktuk.id)">
        <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4.46515 7.20307H18.7973" stroke="#E26161" stroke-width="1.79152" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.83948 10.7858V16.1604" stroke="#E26161" stroke-width="1.79152" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.4224 10.7858V16.1604" stroke="#E26161" stroke-width="1.79152" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.3606 7.20307L6.25636 17.9522C6.25636 18.4274 6.44511 18.883 6.78108 19.219C7.11706 19.555 7.57274 19.7437 8.04788 19.7437H15.214C15.6891 19.7437 16.1448 19.555 16.4808 19.219C16.8167 18.883 17.0055 18.4274 17.0055 17.9522L17.9013 7.20307" stroke="#E26161" stroke-width="1.79152" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.94354 7.20341V4.51612C8.94354 4.27855 9.03792 4.05071 9.20591 3.88272C9.37389 3.71474 9.60173 3.62036 9.8393 3.62036H13.4224C13.6599 3.62036 13.8878 3.71474 14.0558 3.88272C14.2237 4.05071 14.3181 4.27855 14.3181 4.51612V7.20341" stroke="#E26161" stroke-width="1.79152" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
       <button (click)="openEditDialog(tuktuk)"> 
        <svg width="22" height="23" viewBox="0 0 22 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.22651 7.11929H5.48981C4.48219 7.11929 3.66534 7.93614 3.66534 8.94376V17.1539C3.66534 18.1615 4.48219 18.9783 5.48981 18.9783H13.6999C14.7075 18.9783 15.5244 18.1615 15.5244 17.1539V14.4172" stroke="#8B909A" stroke-width="1.59641" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.2265 14.4171H10.9632L18.7172 6.66316C19.4729 5.90744 19.4729 4.68218 18.7172 3.92646C17.9615 3.17074 16.7362 3.17074 15.9805 3.92646L8.2265 11.6804V14.4171" stroke="#8B909A" stroke-width="1.59641" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14.6122 5.29483L17.3489 8.03153" stroke="#8B909A" stroke-width="1.59641" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
     
    </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef=" displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns:  displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</div>
</div>
