
<div class="main">
  
  <div class="header">
   <button class="download-btn" (click)="exportToPDF()" style="margin: 10px;">
    <svg width="22" height="23" viewBox="0 0 22 23" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></button>
  </div>
  <h1 class="title">Etat générale :</h1>
<p class="table-title">Statistiques des taxis :</p>
<div>
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    
    <!-- Wilaya Column (Static) -->
    <ng-container matColumnDef="wilaya">
      <th mat-header-cell *matHeaderCellDef> Wilaya </th>
      <td mat-cell *matCellDef="let element"> {{element.wilaya}} </td>
    </ng-container>

    <!-- Les enregistrés Column (Dynamic) -->
    <ng-container matColumnDef="enregistres">
      <th mat-header-cell *matHeaderCellDef> Enregistrés </th>
      <td mat-cell *matCellDef="let element"> {{element.enregistres}} </td>
    </ng-container>

    <!-- Header and Row Declarations -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>

<p class="table-title">Statistiques des tuck_tuck :</p>
<div>
  <table mat-table [dataSource]="dataSource1" matSort class="mat-elevation-z8">
    
    <!-- Wilaya Column (Static) -->
    <ng-container matColumnDef="wilaya">
      <th mat-header-cell *matHeaderCellDef> Wilaya </th>
      <td mat-cell *matCellDef="let element"> {{element.wilaya}} </td>
    </ng-container>

    <!-- Les enregistrés Column (Dynamic) -->
    <ng-container matColumnDef="enregistres">
      <th mat-header-cell *matHeaderCellDef> Enregistrés </th>
      <td mat-cell *matCellDef="let element"> {{element.enregistres}} </td>
    </ng-container>
    <ng-container matColumnDef="logos">
      <th mat-header-cell *matHeaderCellDef>Logos</th>
      <td mat-cell *matCellDef="let element"> {{element.logos}} </td>
    </ng-container>

    <!-- Header and Row Declarations -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns1"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns1;"></tr>
</table>
</div>
</div>
